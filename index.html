<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vijesha Choudhary | Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
}

/* Header */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:rgba(255,255,255,0.96);
    backdrop-filter:blur(12px);
    box-shadow:0 2px 15px rgba(0,0,0,.08);
    z-index:1000;
    text-align:center;
    padding:18px 20px;
}

header h1{
    font-size:2.2rem;
    color:#222;
    margin-bottom:6px;
}

header p{
    color:#666;
    font-size:1.1rem;
}

.download{
    margin-top:15px;
}

.download a{
    text-decoration:none;
    background:#2d6cdf;
    color:white;
    padding:12px 26px;
    border-radius:8px;
    transition:.25s;
    font-size:16px;
}

.download a:hover{
    background:#1b53b6;
}

/* Portfolio */

.portfolio{
    margin-top:170px;
}

.page{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:40px;
}

.page img{
    width:min(100%,1200px);
    height:auto;
    display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    border-radius:6px;
}

/* Mobile */

@media(max-width:768px){

header h1{
    font-size:1.7rem;
}

header p{
    font-size:1rem;
}

.portfolio{
    margin-top:150px;
}

.page img{
    width:100%;
    border-radius:0;
    box-shadow:none;
}

}
</style>

</head>
<body>

<header>

<h1>Vijesha Choudhary</h1>

<p>Architecture • Design • Creativity</p>

<div class="download">
<a href="portfolio.pdf" download>Download Portfolio PDF</a>
</div>

</header>

<div class="portfolio">

<div class="page">
<img src="portfolio-images-1.jpg" alt="Portfolio Page 1">
</div>

<div class="page">
<img src="portfolio-images-2.jpg" alt="Portfolio Page 2">
</div>

<div class="page">
<img src="portfolio-images-3.jpg" alt="Portfolio Page 3">
</div>

<div class="page">
<img src="portfolio-images-4.jpg" alt="Portfolio Page 4">
</div>

<div class="page">
<img src="portfolio-images-5.jpg" alt="Portfolio Page 5">
</div>

<div class="page">
<img src="portfolio-images-6.jpg" alt="Portfolio Page 6">
</div>

<div class="page">
<img src="portfolio-images-7.jpg" alt="Portfolio Page 7">
</div>

<div class="page">
<img src="portfolio-images-8.jpg" alt="Portfolio Page 8">
</div>

<div class="page">
<img src="portfolio-images-9.jpg" alt="Portfolio Page 9">
</div>

</div>

</body>
</html>
